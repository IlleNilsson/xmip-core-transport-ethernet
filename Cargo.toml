[package]
name = "xmip-core-transport-ethernet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-ethernet"
description = "Ethernet transport: raw IEEE 802.3 frames below IP under Xmip's own EtherType — one frame is one Stream up to the MTU, jumbo where the link allows; an in-process loopback link everywhere, the OS raw socket where it is permitted. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`), the same on every operating system.
transport = { workspace = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# A MAC address in IEEE 802 notation, read and written once.
net = { workspace = true, optional = true }

# The kernel's link on Linux, behind the `packet` feature (`packet.rs`): a raw
# `AF_PACKET` socket bound to the interface a Location names, through
# `nix`'s safe calls — the interface's own link address taken from the
# kernel's list of interfaces (`getifaddrs`), so nothing here builds a
# `sockaddr_ll` and this crate keeps no `unsafe`. Off by default: the socket
# needs `CAP_NET_RAW`, which a box grants a node or does not.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["net"], optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:net"]
# The declaration alone.
declaration = []
# The kernel's link on Linux; the technology's code, so the default with it.
packet = ["default", "dep:nix"]

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
